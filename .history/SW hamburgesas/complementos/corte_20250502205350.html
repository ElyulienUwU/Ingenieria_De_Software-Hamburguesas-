<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>corte</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div>
        <h2>Contabilidad</h2>
        <p><strong>Activo:</strong> $<span id="activo">5000</span></p>
        <p><strong>Pasivo:</strong> $<span id="pasivo">1000</span></p>
        <p><strong>Capital:</strong> $<span id="capital">4000</span></p>
        <hr>
        <h3>Registrar una Compra</h3>
        <form id="form-compra">
            <input type="text" id="producto-compra" placeholder="Producto" required>
            <input type="number" id="cantidad-compra" placeholder="Cantidad" required>
            <input type="number" step="0.01" id="precio-compra" placeholder="Precio Unitario" required>
            <button type="submit">Registrar Compra</button>
        </form>
        <h3>Registrar un Gasto</h3>
        <form id="form-gasto">
            <input type="text" id="concepto-gasto" placeholder="Concepto" required>
            <input type="number" step="0.01" id="monto-gasto" placeholder="Monto" required>
            <button type="submit">Registrar Gasto</button>
        </form>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
