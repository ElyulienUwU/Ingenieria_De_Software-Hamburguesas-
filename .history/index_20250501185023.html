<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Gestión de Restaurante</h1>
            <nav>
                <button onclick="showSection('ventas')">ventas</button>
                <button onclick="showSection('finanzas')">Resumen</button>
            </nav>
        </header>

        <div class="section" id="ventas">
            <h2>Ventas</h2>
            <form id="form-venta">
                <label for="producto">Selecciona un Producto:</label>
                <select id="producto">
                    <option value="hamburguesa">Hamburguesa Clásica - $5.00</option>
                    <option value="cheeseburger">Cheeseburger - $5.50</option>
                    <option value="veggie">Hamburguesa Veggie - $4.50</option>
                </select>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="1" value="1" required>

                <h3>Personaliza tu Pedido:</h3>
                <label>
                    <input type="checkbox" id="agregarQueso"> Añadir Queso (+$1.00)
                </label><br>
                <label>
                    <input type="checkbox" id="agregarBacon"> Añadir Bacon (+$1.50)
                </label><br>
                <label>
                    <input type="checkbox" id="quitarLechuga"> Quitar Lechuga (-$0.50)
                </label><br>
                <label>
                    <input type="checkbox" id="quitarTomate"> Quitar Tomate (-$0.50)
                </label><br>

                <button type="submit">Registrar Venta</button>
            </form>
            <h3>Total Venta: $<span id="total-venta">0.00</span></h3>
        </div>

        <div class="section" id="finanzas">
            <h2>Resumen</h2>
            <h3>Registro de Ventas</h3>
            <ul id="listaVentas">
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
