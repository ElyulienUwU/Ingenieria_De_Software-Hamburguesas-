<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ventas</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div>
        <h2>Ventas</h2>
        <form id="form-venta">
            <label for="producto">Selecciona un Producto:</label>
            <select id="producto">
                <option value="hamburguesa">Hamburguesa Clásica - $5.00</option>
                <option value="cheeseburger">Cheeseburger - $5.50</option>
                <option value="veggie">Hamburguesa Veggie - $4.50</option>
            </select>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1" value="1" required>

            <h3>Personaliza tu Pedido:</h3>
            <label>
                <input type="checkbox" id="agregarQueso"> Añadir Queso (+$1.00)
            </label><br>
            <label>
                <input type="checkbox" id="agregarBacon"> Añadir Bacon (+$1.50)
            </label><br>
            <label>
                <input type="checkbox" id="quitarLechuga"> Quitar Lechuga (-$0.50)
            </label><br>
            <label>
                <input type="checkbox" id="quitarTomate"> Quitar Tomate (-$0.50)
       x     </label><br>
            
            <button type="submit" id="submit">Registrar Venta</button>
        </form>
        <h3>Total Ventas: $<span id="total-ventas">0.00</span></h3>
    </div>
</div>
<script src="../js/ventas.js"></script>
</body>
</html>
